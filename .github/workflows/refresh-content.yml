name: Refresh content

# Reruns the R pipeline so new publications appear without a manual push.
# Crossref is the source, so the only thing that changes between runs is
# whatever Crossref has newly indexed.
on:
  schedule:
    # 11:00 UTC on the 1st and 15th, which is early morning in Central time.
    # GitHub runs scheduled jobs on a best-effort basis and can be late under load.
    - cron: '0 11 1,15 * *'
  workflow_dispatch:

# A push made with GITHUB_TOKEN does not trigger deploy.yml, so this workflow
# builds and deploys itself rather than waiting for a push to chain.
permissions:
  contents: write
  pages: write
  id-token: write

# Shared with deploy.yml so two runs never deploy Pages at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          # Serves precompiled Linux binaries, which avoids long source builds
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::here
            any::yaml
            any::readr
            any::dplyr
            any::purrr
            any::stringr
            any::tibble
            any::httr2

      - name: Run the pipeline
        # Optional: set a CROSSREF_MAILTO repo secret to use Crossref's faster
        # polite pool. The pipeline works without it.
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: Rscript R/update_all.R

      - name: Commit any content changes
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content changes; nothing to deploy."
          else
            git commit -m "Refresh content from Crossref [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Content updated:"
            git show --stat --oneline HEAD
          fi

      # Build only when something changed, so a quiet run costs almost nothing
      - name: Build site
        if: steps.commit.outputs.changed == 'true'
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
