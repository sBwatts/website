# CV and profile source. Edit this file, then run R/update_cv.R (or R/update_all.R).
#
# person:      name, contact, sidebar text, and the home page bio
# experience:  appointments shown as a timeline on the CV page
# education:   degrees shown as a timeline on the CV page
# sections:    anything else (awards, teaching, service). Each becomes a list in the CV body.

person:
  name: "Seth Watts"
  title: "Assistant Professor"
  department: "School of Criminal Justice and Criminology"
  university: "Texas State University"
  # What the left sidebar shows under your name. Leave blank to use
  # "department, university" instead.
  institution_display: "Texas State University"
  email: ""             # public academic address, shown in the footer. Leave blank to hide.
  avatar: "images/headshot.jpeg"   # file in public/, for example "images/headshot.jpg"
  # One or two sentences shown in the left sidebar under your name.
  short_bio: "I study policing, technology, and public health."
  # Paragraphs shown on the About page. Separate paragraphs with a blank line.
  summary: |
    I am an assistant professor in the [School of Criminal Justice and Criminology](https://www.cj.txst.edu/) at Texas State University. I study all things policing with a focus on technological innovation and involvement in public health issues (e.g. opioid overdoses).
  pdf_url: "/cv/cv.pdf"                 # for example "/cv.pdf" (place the file in public/). Leave blank to hide.

experience:
  - role: "Assistant Professor"
    institution: "School of Criminal Justice and Criminology, Texas State University"
    period: "2025 - present"
    description: ""

education:
  - degree: "Ph.D. in Criminology and Criminal Justice"
    institution: "Arizona State University"
    period: "2021 - 2024"
    thesis: ""
    description: ""

sections:
  - title: "Awards and Honors"
    entries: []
  - title: "Teaching"
    entries: []
  - title: "Service"
    entries: []
